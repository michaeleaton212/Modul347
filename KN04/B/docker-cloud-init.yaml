#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/ubuntu
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  teacher
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID3tTU7K5QS1ZQkdowerem4fJE4ztxgeXFhJEzBSCmtR michael.eaton@edu.tbz.ch

ssh_pwauth: false
disable_root: false
package_update: true
package_upgrade: true

groups:
  - docker

system_info:
  default_user:
    groups: [docker]

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - unattended-upgrades

final_message: "The system is finally up, after $UPTIME seconds"

write_files:
  - path: /opt/m346/docker-compose.yml
    permissions: "0644"
    owner: root:root
    content: |
      services:
        web:
          build: /opt/m346
          container_name: m346-web
          ports:
            - "80:80"
          volumes:
            - /opt/m346/app:/var/www/html
          depends_on:
            - db
          restart: unless-stopped

        db:
          image: mysql:8.0
          container_name: m346-db
          environment:
            MYSQL_ROOT_PASSWORD: rootpwd
            MYSQL_DATABASE: kn04db
          volumes:
            - /opt/m346/db-init:/docker-entrypoint-initdb.d
          restart: unless-stopped

  - path: /opt/m346/Dockerfile
    permissions: "0644"
    owner: root:root
    content: |
      FROM php:8.2-apache
      RUN docker-php-ext-install mysqli

  - path: /opt/m346/db-init/init.sql
    permissions: "0644"
    owner: root:root
    content: |
      CREATE DATABASE IF NOT EXISTS kn04db;
      USE kn04db;

  - path: /opt/m346/app/index.php
    permissions: "0644"
    owner: root:root
    content: |
      <?php
      echo "<h1>M346 Docker Compose Cloud</h1>";
      echo "<p><a href='db.php'>Zur db.php</a></p>";
      echo "<p><a href='info.php'>Zur info.php</a></p>";
      ?>

  - path: /opt/m346/app/db.php
    permissions: "0644"
    owner: root:root
    content: |
      <html>

      <head></head>

      <body>
          Diese Seite macht eine Abfrage auf die Datenbank. <br />
          Das ausgeführte Query ist: <i>select Host, User from mysql.user;</i><br /><br />
          Das Resultat: <br />
          <?php
          //database (angepasst für m347)
          $servername = "db";
          $username = "root";
          $password = "rootpwd";
          $dbname = "kn04db";

          // Create connection
          $conn = new mysqli($servername, $username, $password, $dbname);
          // Check connection
          if ($conn->connect_error) {
              die("Connection failed: " . $conn->connect_error);
          }

          $sql = "select Host, User from mysql.user;";
          $result = $conn->query($sql);
          while ($row = $result->fetch_assoc()) {
              echo ("<li>" . $row["Host"] . " / " . $row["User"] . "</li>");
          }
          //var_dump($result);
          ?>
      </body>

      </html>

  - path: /opt/m346/app/info.php
    permissions: "0644"
    owner: root:root
    content: |
      <?php

      // Show all information, defaults to INFO_ALL
      phpinfo();

      ?>

runcmd:
  - mkdir -p /etc/apt/keyrings
  - mkdir -p /opt/m346/app
  - mkdir -p /opt/m346/db-init
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - cd /opt/m346 && docker compose up -d --build
  - sleep 20
  - docker ps
  - curl http://localhost/ || true
  - curl http://localhost/info.php || true
  - curl http://localhost/db.php || true
